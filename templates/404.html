<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found — EduPredict</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 flex items-center justify-center p-6">
    <div class="max-w-md w-full text-center space-y-6 bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-xl">
        <div class="w-20 h-20 mx-auto rounded-3xl bg-indigo-50 dark:bg-indigo-950/40 text-[#4F46E5] flex items-center justify-center text-3xl shadow-inner">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div class="space-y-2">
            <h1 class="text-3xl font-black text-slate-900 dark:text-white tracking-tight">Page Not Found</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400">The requested route or Hadoop cluster endpoint could not be found.</p>
        </div>
        <div>
            <a href="/" class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-[#4F46E5] text-white font-bold text-xs rounded-xl shadow-md shadow-indigo-600/20 hover:opacity-95 transition-opacity inline-flex items-center">
                <i class="fa-solid fa-house mr-2"></i> Return to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
