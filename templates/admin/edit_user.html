{% extends "base.html" %}
{% block title %}Edit User — EduPredict{% endblock %}
{% block content %}
<div class="max-w-3xl"><form method="POST" class="bg-white p-6 rounded-2xl border border-gray-200 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="user_id" value="{{ user['_id'] }}">
    <h1 class="text-2xl font-bold">Edit User Profile</h1>
    <div class="grid md:grid-cols-2 gap-4"><label class="text-xs font-semibold">Full name<input name="name" required value="{{ user.get('name', '') }}" class="mt-1 w-full px-3 py-2 border rounded-xl"></label><label class="text-xs font-semibold">Email<input type="email" name="email" required value="{{ user.get('email', '') }}" class="mt-1 w-full px-3 py-2 border rounded-xl"></label></div>
    <div class="grid md:grid-cols-2 gap-4"><label class="text-xs font-semibold">Role<select name="role" class="mt-1 w-full px-3 py-2 border rounded-xl">{% for role in ['student', 'teacher', 'admin', 'analyst'] %}<option value="{{ role }}" {% if user.get('role') == role %}selected{% endif %}>{{ role|capitalize }}</option>{% endfor %}</select></label><label class="text-xs font-semibold">Department<input name="department" value="{{ user.get('department', '') }}" class="mt-1 w-full px-3 py-2 border rounded-xl"></label></div>
    <label class="text-xs font-semibold">Status<select name="status" class="mt-1 w-full px-3 py-2 border rounded-xl">{% for status in ['approved', 'pending', 'rejected', 'suspended', 'deleted'] %}<option value="{{ status }}" {% if user.get('status', 'approved') == status %}selected{% endif %}>{{ status|capitalize }}</option>{% endfor %}</select></label>
    <label class="text-xs font-semibold">New password (leave blank to keep current)<input type="password" name="password" class="mt-1 w-full px-3 py-2 border rounded-xl"></label>
    <div class="flex justify-end"><button class="px-5 py-2.5 bg-[#4F46E5] text-white text-xs rounded-xl">Save Changes</button></div>
</form>
<form method="POST" action="{{ url_for('admin.delete_user', user_id=user['_id']) }}" class="mt-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="px-4 py-2 bg-red-100 text-red-700 text-xs rounded-xl">Deactivate Account</button></form></div>
{% endblock %}
