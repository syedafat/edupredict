{% extends "base.html" %}
{% block title %}System Settings — EduPredict{% endblock %}
{% block content %}
<div class="max-w-4xl space-y-6">
    <div class="bg-white p-6 rounded-2xl border border-gray-200"><h1 class="text-2xl font-bold">Platform Settings</h1><p class="text-xs text-gray-500 mt-1">These settings are stored in MongoDB and applied to the platform UI.</p></div>
    <form method="POST" class="bg-white p-6 rounded-2xl border border-gray-200 space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="grid md:grid-cols-2 gap-4">
            <label class="text-xs font-semibold">Platform name<input name="platform_name" value="{{ settings.get('platform_name', 'EduPredict') }}" required class="mt-1 w-full px-3 py-2 border rounded-xl"></label>
            <label class="text-xs font-semibold">Admin notification email<input type="email" name="admin_email" value="{{ settings.get('admin_email', '') }}" class="mt-1 w-full px-3 py-2 border rounded-xl"></label>
            <label class="text-xs font-semibold">Academic term<input name="academic_term" value="{{ settings.get('academic_term', '') }}" class="mt-1 w-full px-3 py-2 border rounded-xl"></label>
            <label class="text-xs font-semibold">NameNode URL<input name="namenode_url" value="{{ settings.get('namenode_url', '') }}" class="mt-1 w-full px-3 py-2 border rounded-xl"></label>
            <label class="text-xs font-semibold">Replication factor<input type="number" min="1" max="20" name="replication_factor" value="{{ settings.get('replication_factor', 3) }}" class="mt-1 w-full px-3 py-2 border rounded-xl"></label>
            <label class="text-xs font-semibold">Spark master URL<input name="spark_master_url" value="{{ settings.get('spark_master_url', '') }}" class="mt-1 w-full px-3 py-2 border rounded-xl"></label>
            <label class="text-xs font-semibold">Minimum attendance %<input type="number" min="0" max="100" step="0.1" name="attendance_minimum" value="{{ settings.get('attendance_minimum', 75) }}" class="mt-1 w-full px-3 py-2 border rounded-xl"></label>
            <label class="text-xs font-semibold">High dropout threshold<input type="number" min="0" max="1" step="0.01" name="dropout_high" value="{{ settings.get('dropout_high', 0.7) }}" class="mt-1 w-full px-3 py-2 border rounded-xl"></label>
            <label class="text-xs font-semibold">Minimum score %<input type="number" min="0" max="100" step="0.1" name="score_minimum" value="{{ settings.get('score_minimum', 50) }}" class="mt-1 w-full px-3 py-2 border rounded-xl"></label>
        </div>
        <label class="inline-flex items-center gap-2 text-sm"><input type="checkbox" name="maintenance_mode" {% if settings.get('maintenance_mode') %}checked{% endif %}> Enable maintenance mode</label>
        <div><button class="px-5 py-2.5 bg-[#4F46E5] text-white text-xs font-semibold rounded-xl">Save Changes</button></div>
    </form>
</div>
{% endblock %}
