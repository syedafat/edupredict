{% extends "base.html" %}
{% block title %}{{ 'Edit' if subject else 'Add' }} Subject — EduPredict{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <form method="POST" class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-gray-200 dark:border-slate-800 space-y-4 shadow-sm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="border-b border-gray-100 dark:border-slate-800 pb-4">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
                {{ 'Edit' if subject else 'Add New' }} Subject
            </h1>
            <p class="text-xs text-gray-500 dark:text-slate-400 mt-1">
                Link this subject to an active academic course. Department hierarchy will automatically sync.
            </p>
        </div>

        <!-- Course Selection -->
        <label class="block text-xs font-semibold text-gray-700 dark:text-slate-300">
            Linked Course <span class="text-red-500">*</span>
            <select name="course_id" required class="mt-1 w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-slate-800 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">-- Select Parent Course --</option>
                {% for c in courses %}
                    <option value="{{ c['_id'] }}" {% if subject and (subject.get('course_id')|string == c['_id']|string) %}selected{% endif %}>
                        {{ c.get('code', 'Course') }} — {{ c.get('title', '') }} ({{ c.get('department', 'General Studies') }})
                    </option>
                {% endfor %}
            </select>
            <span class="block text-[11px] text-gray-400 font-normal mt-1">
                The subject will automatically inherit the department from the selected course.
            </span>
        </label>

        <!-- Subject Name & Code in 2 columns -->
        <div class="grid md:grid-cols-2 gap-4">
            <label class="block text-xs font-semibold text-gray-700 dark:text-slate-300">
                Subject Code <span class="text-red-500">*</span>
                <input type="text" name="code" required value="{{ subject.get('code', '') if subject else '' }}" placeholder="e.g., CS101-DSA" class="mt-1 w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-slate-800 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 uppercase font-mono">
            </label>

            <label class="block text-xs font-semibold text-gray-700 dark:text-slate-300">
                Subject Name <span class="text-red-500">*</span>
                <input type="text" name="name" required value="{{ subject.get('name', '') if subject else '' }}" placeholder="e.g., Data Structures & Algorithms" class="mt-1 w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-slate-800 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </label>
        </div>

        <!-- Description -->
        <label class="block text-xs font-semibold text-gray-700 dark:text-slate-300">
            Subject Description (Optional)
            <textarea name="description" rows="3" placeholder="Outline syllabus, primary learning outcomes, or lab requirements..." class="mt-1 w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-slate-800 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">{{ subject.get('description', '') if subject else '' }}</textarea>
        </label>

        <!-- Status -->
        <label class="block text-xs font-semibold text-gray-700 dark:text-slate-300">
            Status
            <select name="status" class="mt-1 w-full px-3 py-2 border rounded-xl bg-gray-50 dark:bg-slate-800 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="active" {% if not subject or subject.get('status') == 'active' %}selected{% endif %}>Active (Available for teachers and students)</option>
                <option value="inactive" {% if subject and subject.get('status') == 'inactive' %}selected{% endif %}>Inactive / Archived</option>
            </select>
        </label>

        <!-- Actions -->
        <div class="pt-4 border-t border-gray-100 dark:border-slate-800 flex items-center gap-3">
            <button type="submit" class="px-5 py-2.5 bg-[#4F46E5] text-white text-xs font-semibold rounded-xl hover:bg-indigo-600 transition shadow-sm shadow-indigo-600/20">
                Save Subject
            </button>
            <a href="{{ url_for('admin.subjects') }}" class="text-xs text-gray-500 hover:text-gray-700 dark:text-slate-400 dark:hover:text-slate-200">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
