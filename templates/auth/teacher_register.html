{% extends "auth_base.html" %}
{% block title %}Teacher Registration — EduPredict{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
    <h1 class="text-2xl font-bold">Teacher Registration</h1>
    <p class="text-sm text-slate-500 mt-1">Your account will remain pending until an administrator approves it.</p>
    <form method="POST" class="mt-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input name="name" required placeholder="Full name" class="w-full px-3 py-2 border rounded-xl">
        <input type="email" name="email" required placeholder="Email address" class="w-full px-3 py-2 border rounded-xl">
        <input name="department" placeholder="Department" class="w-full px-3 py-2 border rounded-xl">
        <input type="password" name="password" required placeholder="Password" class="w-full px-3 py-2 border rounded-xl">
        <input type="password" name="confirm_password" required placeholder="Confirm password" class="w-full px-3 py-2 border rounded-xl">
        <button class="w-full px-4 py-2.5 bg-[#4F46E5] text-white rounded-xl font-semibold">Submit Registration</button>
    </form>
    <a href="{{ url_for('auth.login') }}" class="block mt-4 text-sm text-slate-500">Back to login</a>
</div>
{% endblock %}
