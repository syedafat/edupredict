<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduPredict{% endblock %}</title>
    <script nonce="{{ csp_nonce }}">
        (() => {
            try {
                const savedTheme = localStorage.getItem('edupredict-theme');
                const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
                document.documentElement.classList.toggle('dark', savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark));
            } catch (error) {
                document.documentElement.classList.toggle('dark', window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false);
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
</head>
<body class="auth-shell h-full bg-slate-50 text-slate-900 font-sans antialiased">
    <button type="button" data-theme-toggle aria-pressed="false" class="fixed right-4 top-4 z-50 flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-600 shadow-sm transition hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800" title="Switch to dark mode" aria-label="Switch to dark mode">
        <i class="fa-solid fa-moon text-sm" data-theme-icon="light"></i>
        <i class="fa-solid fa-sun hidden text-sm" data-theme-icon="dark"></i>
    </button>
    {% block content %}{% endblock %}

</body>
</html>
