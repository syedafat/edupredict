{% extends "base.html" %}
{% block title %}Create Support Ticket — EduPredict{% endblock %}

{% block content %}
<div class="space-y-6 max-w-3xl mx-auto">
    <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm transition-colors">
        <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">Create Support Ticket</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Submit a new request to the university IT desk or faculty support team.</p>
    </div>

    <div class="bg-white dark:bg-slate-900 p-8 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm transition-colors">
        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Subject / Title</label>
                <input type="text" name="subject" required placeholder="Brief description of the issue..." class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-600/20">
            </div>

            <div>
                <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Message / Details</label>
                <textarea name="message" rows="5" required placeholder="Provide full context, error logs, or relevant details..." class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-600/20"></textarea>
            </div>

            <div class="flex justify-end space-x-3 pt-4">
                <a href="{{ url_for('support.list_tickets') }}" class="px-5 py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 font-bold text-xs rounded-xl transition-colors">Cancel</a>
                <button type="submit" class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-[#4F46E5] text-white font-bold text-xs rounded-xl shadow-md shadow-indigo-600/20 hover:opacity-95 transition-opacity flex items-center">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Submit Ticket
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
